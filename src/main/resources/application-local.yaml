APP_DATABASE_RETRY_ATTEMPTS: 3
APP_DATABASE_RETRY_BACKOFF: 500
APP_DEPLOY_URL: http://localhost:8080/api/v1/url-shortener
APP_SHORTENER_KEY_LENGTH: 7
APP_SHORTENER_MAX_KEY_ATTEMPTS: 5
# Dev-only HS256 secret (>= 32 bytes). Never use this value outside local.
APP_SECURITY_JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
DATASOURCE_URL: jdbc:h2:file:~/data/database;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
DRIVER_CLASS_NAME: org.h2.Driver
DB_USERNAME: sa
DB_PASSWORD: password
DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
DDL_AUTO: validate

spring:
  h2:
    console:
      enabled: true

