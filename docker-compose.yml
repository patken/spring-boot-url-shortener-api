services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/urlshortener
      DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_USERNAME: urlshortener
      DB_PASSWORD: urlshortener
      DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      DDL_AUTO: validate
      APP_DATABASE_RETRY_ATTEMPTS: "3"
      APP_DATABASE_RETRY_BACKOFF: "500"
      APP_DEPLOY_URL: http://localhost:8080/api/v1/url-shortener
      # Dev-only secret (>= 32 bytes). Override in real deployments.
      APP_SECURITY_JWT_SECRET: docker-compose-dev-secret-change-me-0123456789
    ports:
      - "8080:8080"

volumes:
  pgdata:
