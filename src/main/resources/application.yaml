spring:
  application:
    name: url-shortener-api
  datasource:
    url: ${DATASOURCE_URL}
    driverClassName: ${DRIVER_CLASS_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DATABASE_PLATFORM}
    hibernate:
      ddl-auto: ${DDL_AUTO}
  h2:
    console:
      enabled: false

management:
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    diskspace:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, check
  endpoint:
    health:
      show-detail: always
  server:
    port: 9999

app:
  retry-database:
    max-attempts: ${APP_DATABASE_RETRY_ATTEMPTS}
    backoff: ${APP_DATABASE_RETRY_BACKOFF}
  deploy:
    url: ${APP_DEPLOY_URL}
  shortener:
    key-length: ${APP_SHORTENER_KEY_LENGTH:7}
    max-key-attempts: ${APP_SHORTENER_MAX_KEY_ATTEMPTS:5}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      # Short-lived access token (seconds) — limits the exposure window of a stolen token.
      ttl: ${APP_SECURITY_JWT_TTL:900}
      # Longer-lived, revocable refresh token (seconds), default 7 days.
      refresh-ttl: ${APP_SECURITY_JWT_REFRESH_TTL:604800}
springdoc:
  swagger-ui:
    url: /openapi/oas3.yaml
    disable-swagger-default-url: true
